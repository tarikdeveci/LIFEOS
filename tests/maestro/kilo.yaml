# Bugünkü tartı. Sad path: aralık dışı (7250, 0) kaydedilmez; virgül ve nokta kabul edilir.
appId: tr.lifeos.app
name: Kilo
tags: [kilo]
---
- runFlow: _ortak/baslat.yaml
- tapOn: "Profile"
- scrollUntilVisible:
    element:
      id: "weight-input"
    timeout: 20000
# Sad: ondalık ayırıcı unutulunca (7250) hata görünür, kayıt olmaz.
- tapOn:
    id: "weight-input"
- eraseText
- inputText: "7250"
- assertVisible: "Enter a value between 30 and 300 kg."
- assertNotVisible: "Saved today"
# Sad: 0 da aralık dışı.
- eraseText
- inputText: "0"
- assertVisible: "Enter a value between 30 and 300 kg."
# Happy: virgüllü değer kaydedilir.
- eraseText
- inputText: "72,5"
- assertNotVisible: "Enter a value between 30 and 300 kg."
- hideKeyboard
- tapOn: "Save today's weigh-in"
- assertVisible: "Saved today"
# Happy: noktalı değer aynı gün kaydı günceller.
- tapOn:
    id: "weight-input"
- eraseText
- inputText: "73.4"
- hideKeyboard
- tapOn: "Update today's weigh-in"
- assertVisible: "Saved today"
