[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]

[db]
port = 54322
shadow_port = 54320
major_version = 17

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "https://lifeos.tr"
additional_redirect_urls = ["http://localhost:3000", "https://lifeos.tr", "https://www.lifeos.tr", "lifeos://"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[storage]
enabled = true
file_size_limit = "50MiB"

[realtime]
enabled = true

# RevenueCat webhook'u Supabase JWT'si üretemez; header'a bizim secret'ımızı
# koyar. verify_jwt açık kalırsa Supabase kapıda 401 verir ve fonksiyon hiç
# çalışmaz. Kapıyı kapatıyoruz — kimlik doğrulama fonksiyon içindeki
# REVENUECAT_WEBHOOK_SECRET karşılaştırması ile yapılıyor (fail-closed).
[functions.revenuecat-webhook]
verify_jwt = false
